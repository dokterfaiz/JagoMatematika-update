<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jago Matematika bersama Dokter Faiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBFCF6; --grid:#DCE7F3; --ink:#1F2A5A; --muted:#5D6690; --margin:#E25C5C;
  --card:#FFFFFF; --line:#C9D6E8; --hl:#FFE066; --good:#1E9E5A; --good-bg:#E2F5EA; --bad:#D23F44; --bad-bg:#FCE6E7;
  --k3:#E07A10; --k4:#2A7FCC; --k5:#7A4FD8; --k6:#0E8C7E; --shade:#F2994A; --on-c:#FFFFFF;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#1C2A24; --grid:#26372F; --ink:#EEF3EA; --muted:#A9BBAF; --margin:#E98A8A;
    --card:#23332C; --line:#3A4F45; --hl:#8C7A1E; --good:#5BD593; --good-bg:#1F4232; --bad:#F2878A; --bad-bg:#4A2629;
    --k3:#C76A0A; --k4:#2672B8; --k5:#6E45C7; --k6:#0C7C70; --shade:#F2A65A; --on-c:#FFFFFF;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1C2A24; --grid:#26372F; --ink:#EEF3EA; --muted:#A9BBAF; --margin:#E98A8A;
  --card:#23332C; --line:#3A4F45; --hl:#8C7A1E; --good:#5BD593; --good-bg:#1F4232; --bad:#F2878A; --bad-bg:#4A2629;
  --k3:#C76A0A; --k4:#2672B8; --k5:#6E45C7; --k6:#0C7C70; --shade:#F2A65A; --on-c:#FFFFFF;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0; color:var(--ink); background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  font-family:'Fredoka',ui-rounded,'Segoe UI',system-ui,sans-serif; font-size:18px; line-height:1.45;
}
#app{max-width:720px; margin:0 auto; padding:18px 16px 48px}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible{outline:3px solid var(--k4); outline-offset:2px}
.top{display:flex; justify-content:space-between; align-items:center; gap:12px}
.brand{font-weight:700; font-size:1.3rem}
.pts{background:var(--hl); color:var(--ink); border-radius:999px; padding:2px 14px; font-weight:600}
h1{font-size:1.75rem; line-height:1.15; margin:22px 0 14px; font-weight:700}
h2{font-size:1.25rem; margin:26px 0 10px; font-weight:600}

/* ---------- Dokter Faiz ---------- */
.fz{flex:none; width:120px}
.fz.sm{width:84px}
.fz.lg{width:150px}
.fz svg{display:block; width:100%; height:auto; overflow:visible}
.fz svg g{transform-box:view-box}
.fz-all{transform-origin:100px 222px; animation:bob 2.6s ease-in-out infinite}
.eyes{transform-origin:100px 90px; animation:blink 4.2s infinite}
.arm-r{transform-origin:139px 152px; transform:rotate(-8deg); transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.arm-l{transform-origin:61px 152px; transform:rotate(8deg); transition:transform .35s cubic-bezier(.3,1.5,.5,1)}
.fz .m{display:none} .fz .m-idle{display:inline}
.fz.waving .arm-r{animation:wave 1.1s ease-in-out infinite}
.fz.mood-happy .fz-all{animation:jump .65s cubic-bezier(.3,1.4,.5,1) 2}
.fz.mood-happy .arm-r{transform:rotate(-155deg)}
.fz.mood-happy .arm-l{transform:rotate(155deg)}
.fz.mood-happy .m-idle,.fz.mood-sad .m-idle{display:none}
.fz.mood-happy .m-happy{display:inline}
.fz.mood-sad .m-sad{display:inline}
.fz.mood-sad .fz-all{animation:tilt 1.4s ease-in-out}
.fz.mood-sad .arm-l{transform:rotate(-30deg)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes wave{0%,100%{transform:rotate(-150deg)}50%{transform:rotate(-115deg)}}
@keyframes jump{0%{transform:translateY(0) scale(1,1)}20%{transform:translateY(0) scale(1.08,.9)}50%{transform:translateY(-28px) scale(.95,1.06)}80%{transform:translateY(0) scale(1.05,.95)}100%{transform:translateY(0) scale(1,1)}}
@keyframes tilt{0%{transform:rotate(0)}30%{transform:rotate(-8deg)}60%{transform:rotate(5deg)}100%{transform:rotate(0)}}

.bubble{position:relative; background:var(--card); border:2px solid var(--line); border-radius:16px; padding:10px 14px; font-weight:500; line-height:1.3}
.bubble::before{content:""; position:absolute; left:-11px; top:50%; margin-top:-9px; border:9px solid transparent; border-right-color:var(--line); border-left:0}
.bubble::after{content:""; position:absolute; left:-8px; top:50%; margin-top:-7px; border:7px solid transparent; border-right-color:var(--card); border-left:0}
.bubble.pop{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.85); opacity:.3}100%{transform:scale(1); opacity:1}}
.hero{display:flex; align-items:center; gap:16px; margin:18px 0 16px}
.hero .bubble{font-size:1.25rem}
.hero .bubble b{font-weight:700}
.coach{display:flex; align-items:center; gap:14px; margin:12px 0 10px}

.hdr-r{display:flex; align-items:center; gap:8px}
.snd{width:40px; height:40px; border-radius:50%; border:2px solid var(--line); background:var(--card); font-size:1.1rem; line-height:1; padding:0}
/* ---------- aktivasi ---------- */
.act label{display:block; font-weight:500; margin:12px 0 6px}
.act input{width:100%; font:inherit; font-size:1.1rem; padding:12px 14px; border:2px solid var(--line); border-radius:12px; background:var(--paper); color:var(--ink)}
.act input:focus{outline:none; border-color:var(--c)}
.act.shake{animation:shake .4s}
.act .mix{margin-top:18px; text-align:center}
.owner{text-align:center; margin-top:14px}
/* ---------- menu ---------- */
.tabs{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.tab{border:2px solid var(--line); background:var(--card); border-radius:12px; padding:8px 4px; font-weight:600}
.tab.on{background:var(--c); border-color:var(--c); color:var(--on-c)}
.mix{display:block; width:100%; margin:16px 0 12px; padding:14px 18px; border:0; border-radius:16px; background:var(--c); color:var(--on-c); font-weight:700; font-size:1.2rem; text-align:left; box-shadow:0 5px 0 color-mix(in srgb,var(--c) 60%,#000); transition:transform .08s, box-shadow .08s}
.mix small{display:block; font-weight:400; font-size:.92rem}
.mix:active{transform:translateY(4px); box-shadow:0 1px 0 color-mix(in srgb,var(--c) 60%,#000)}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(155px,1fr)); gap:10px}
.tcard{background:var(--card); border:2px solid var(--line); border-radius:14px; padding:12px 14px; text-align:left; display:flex; flex-direction:column; gap:4px; min-height:118px; box-shadow:0 4px 0 var(--line); transition:transform .08s, box-shadow .08s}
.tcard:hover{border-color:var(--c)}
.tcard:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line)}
.tcard .ic{font-size:1.7rem}
.tcard b{font-weight:600; line-height:1.2}
.tcard .acc{font-size:.85rem; color:var(--muted); margin-top:auto}
.tcard .new{align-self:flex-start; font-size:.75rem; background:var(--hl); color:var(--ink); border-radius:999px; padding:0 8px}
.plain{background:none; border:2px dashed var(--line); border-radius:12px; padding:10px 14px; width:100%; margin-top:18px; font-weight:500}

/* ---------- kuis ---------- */
.qtop{display:flex; align-items:center; gap:10px}
.x{width:40px; height:40px; border-radius:50%; border:2px solid var(--line); background:var(--card); flex:none}
.bar{flex:1; height:16px; border-radius:999px; background:var(--card); border:2px solid var(--line); overflow:hidden}
.bar i{display:block; height:100%; background:var(--c); border-radius:999px; transition:width .45s cubic-bezier(.3,1.4,.5,1); position:relative}
.bar i::after{content:""; position:absolute; left:8px; right:8px; top:3px; height:3px; border-radius:2px; background:#fff; opacity:.35}
.cnt{font-weight:600; min-width:44px; text-align:right}
.streak{font-weight:700; color:var(--k3); min-width:44px; text-align:center}
.streak.bump{animation:pop .4s cubic-bezier(.3,1.8,.5,1)}
.page{position:relative; background:var(--card); border:2px solid var(--line); border-radius:6px 18px 18px 6px; padding:20px 18px 20px 40px; text-align:center}
.page::before{content:""; position:absolute; top:0; bottom:0; left:24px; width:2px; background:var(--margin); opacity:.7}
.label{font-size:1.1rem; margin-bottom:8px}
.qtext{font-size:2.2rem; font-weight:600; line-height:1.25}
.qtext.long{font-size:1.25rem; font-weight:500; line-height:1.4; text-align:left}
.box{display:inline-block; min-width:1.3em; border:3px dashed var(--c); border-radius:10px; padding:0 .2em; color:var(--c); line-height:1.1}
.vis{margin-top:10px}
.vis svg{max-width:100%; height:auto}
.growbar{transform-box:fill-box; transform-origin:bottom; animation:grow .6s ease-out both}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.opts{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:14px}
.opt{position:relative; background:var(--card); border:2px solid var(--line); border-radius:14px; padding:14px 8px; font-size:1.4rem; font-weight:600; min-height:72px; box-shadow:0 4px 0 var(--line); transition:transform .08s, box-shadow .08s}
.opt:not(:disabled):hover{border-color:var(--c)}
.opt:not(:disabled):active{transform:translateY(3px); box-shadow:0 1px 0 var(--line)}
.opt.right{background:var(--good-bg); border-color:var(--good); box-shadow:0 4px 0 var(--good); animation:pop .35s cubic-bezier(.3,1.8,.5,1)}
.opt.wrong{background:var(--bad-bg); border-color:var(--bad); box-shadow:0 4px 0 var(--bad); animation:shake .4s}
.opt:disabled{cursor:default}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.xp{position:absolute; left:50%; top:0; font-size:1rem; font-weight:700; color:var(--good); pointer-events:none; animation:xp 1s ease-out forwards}
@keyframes xp{from{opacity:1; transform:translate(-50%,0)}to{opacity:0; transform:translate(-50%,-56px)}}
.fb{margin-top:16px; border-radius:14px; padding:14px 16px; border:2px solid; animation:slide .35s ease-out}
@keyframes slide{from{opacity:0; transform:translateY(16px)}to{opacity:1; transform:none}}
.fb.good{background:var(--good-bg); border-color:var(--good)}
.fb.bad{background:var(--bad-bg); border-color:var(--bad)}
.fb b{font-size:1.2rem; font-weight:600; display:block}
.note{font-family:'Patrick Hand','Comic Sans MS',cursive; font-size:1.3rem; line-height:1.5; margin:8px 0 4px}
details summary{cursor:pointer; font-weight:500; margin-top:6px}
.next{margin-top:12px; width:100%; border:0; border-radius:12px; padding:12px; background:var(--c); color:var(--on-c); font-weight:700; font-size:1.15rem; box-shadow:0 4px 0 color-mix(in srgb,var(--c) 60%,#000)}
.next:active{transform:translateY(3px); box-shadow:0 1px 0 color-mix(in srgb,var(--c) 60%,#000)}
.fr{display:inline-flex; flex-direction:column; align-items:center; vertical-align:middle; line-height:1.05; margin:0 .12em; font-size:.85em}
.fr span:first-child{border-bottom:2px solid currentColor; padding:0 .2em .05em}
.fr span:last-child{padding:.05em .2em 0}

/* ---------- hasil ---------- */
.res{text-align:center}
.res .fz{margin:14px auto 0}
.stars{font-size:3rem; letter-spacing:6px}
.stars span{display:inline-block; animation:starpop .5s cubic-bezier(.3,1.8,.5,1) both}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
.res p{margin:6px 0}
.wcard{background:var(--card); border:2px solid var(--line); border-radius:14px; padding:12px 16px; margin:10px 0; text-align:left}
.wq{font-size:1.3rem; font-weight:600}

/* ---------- laporan ---------- */
.rrow{background:var(--card); border:2px solid var(--line); border-radius:12px; padding:10px 14px; margin:8px 0}
.rname{display:flex; justify-content:space-between; gap:8px; font-weight:500}
.rname small{color:var(--muted); font-weight:400; white-space:nowrap}
.rline{display:flex; align-items:center; gap:10px; margin-top:6px}
.rbar{flex:1; height:10px; background:var(--paper); border-radius:999px; overflow:hidden; border:1px solid var(--line)}
.rbar i{display:block; height:100%}
.badge{font-size:.85rem; padding:1px 10px; border-radius:999px; white-space:nowrap}
.low{background:var(--bad)} .badge.low{background:var(--bad-bg); color:var(--bad); border:1px solid var(--bad)}
.mid{background:var(--shade)} .badge.mid{background:var(--hl); color:var(--ink)}
.ok{background:var(--good)} .badge.ok{background:var(--good-bg); color:var(--good); border:1px solid var(--good)}
.badge.nd{color:var(--muted); border:1px solid var(--line)}
.focus{background:var(--hl); border-radius:12px; padding:10px 14px; margin-top:12px}
.small{color:var(--muted); font-size:.9rem}

.confetti{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:50}
.confetti i{position:absolute; top:-16px; width:9px; height:14px; border-radius:2px; animation:fall linear forwards}
@keyframes fall{to{transform:translate(var(--dx),105vh) rotate(var(--r))}}

@media (max-width:420px){ .qtext{font-size:1.9rem} .opt{font-size:1.2rem} h1{font-size:1.5rem} .hero .bubble{font-size:1.1rem} .fz{width:100px} .fz.sm{width:72px} }
@media (prefers-reduced-motion:reduce){ *,*::before,*::after{animation:none!important; transition:none!important} }
/* ---------- v3: navigasi, XP, hafalan, permainan ---------- */
#app{padding-bottom:112px}
.prof{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px 14px 3px 6px;font-weight:600;min-width:0;max-width:46vw}
.prof .av{font-size:1.4rem}.prof .pn{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.hdr-r{gap:6px}
.chip{background:var(--card);border:2px solid var(--line);border-radius:999px;padding:3px 9px;font-weight:700;font-size:.88rem;white-space:nowrap}
.chip.fire{color:#E8590C}.chip.fire.off{filter:grayscale(1);opacity:.55}
.goal{display:flex;align-items:center;gap:10px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:8px 14px;margin:2px 0 14px;font-weight:600;font-size:.9rem}
.gbar{flex:1;height:12px;border-radius:999px;background:var(--paper);border:1px solid var(--line);overflow:hidden}
.gbar i{display:block;height:100%;background:linear-gradient(90deg,#FFB020,#E8590C);border-radius:999px;transition:width .6s}
.jtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.jt{border:2px solid var(--line);background:var(--card);border-radius:12px;padding:9px 4px;font-weight:700}
.jt.on{background:var(--jc);border-color:var(--jc);color:#fff}
.ltabs,.lvsel{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap;align-items:center}
.lt{min-width:44px;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:6px 10px;font-weight:700}
.lt.on{background:var(--c);border-color:var(--c);color:#fff}
.mbar{display:inline-flex;gap:2px;vertical-align:middle;margin-right:4px}
.mbar i{width:12px;height:6px;border-radius:3px;background:var(--line)}
.mbar.m1 i:nth-child(1),.mbar.m2 i:nth-child(-n+2){background:var(--c)}
.mbar.m3 i{background:#E0A800}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:2px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.78rem;font-weight:600;color:var(--muted);padding:5px 0;border-radius:12px}
.nav button span{font-size:1.35rem}
.nav button.on{color:var(--c);background:rgba(127,127,127,.12)}
.sheet-wrap{position:fixed;inset:0;z-index:60;background:rgba(20,24,40,.45);display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
.sheet{background:var(--paper);width:100%;max-width:720px;border-radius:24px 24px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;animation:up .3s cubic-bezier(.3,1.3,.5,1)}
.sheet h2{margin-top:0}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(40px);opacity:.4}}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mode{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px;box-shadow:0 4px 0 var(--line);transition:transform .08s,box-shadow .08s}
.mode .mi{font-size:1.8rem}.mode small{color:var(--muted)}
.mode:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.cand{margin-top:12px;font-size:1.3rem;background:var(--hl);border-radius:12px;padding:8px 14px;display:inline-block}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.isian{margin-top:14px}
.layar{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card);border:3px solid var(--c);border-radius:14px;padding:10px;font-size:1.9rem;font-weight:700;min-height:68px}
.layar.right{border-color:var(--good);background:var(--good-bg)}.layar.wrong{border-color:var(--bad);background:var(--bad-bg);animation:shake .4s}
.layar .u{color:var(--muted);font-size:1.2rem}
.pad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.key{position:relative;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:11px 0;font-size:1.3rem;font-weight:700;box-shadow:0 3px 0 var(--line)}
.key.nol{grid-column:span 2}.key.ok{grid-column:span 2;background:var(--c);border-color:var(--c);color:#fff}
.key:active{transform:translateY(2px)}.key:disabled{opacity:.6}
.kskor{text-align:center;font-weight:800;font-size:1.25rem;margin:12px 0 8px}
.board{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.board .col{display:flex;flex-direction:column;gap:10px}
.tile{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px 6px;font-weight:600;font-size:1.05rem;min-height:60px;box-shadow:0 3px 0 var(--line)}
.tile.sel{border-color:var(--c);background:var(--hl)}
.tile.done{border-color:var(--good);background:var(--good-bg);opacity:.55;pointer-events:none;box-shadow:none}
.tile.wrong{border-color:var(--bad);background:var(--bad-bg);animation:shake .4s}
.emo{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;font-size:2rem;line-height:1.2;max-width:300px;margin:0 auto}
.pair{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap}.pair .emo{font-size:1.6rem;max-width:150px}
.vs{font-weight:800;font-size:1.3rem;color:var(--muted)}
.groups{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}.grp{border:2px dashed var(--line);border-radius:12px;padding:4px 8px;font-size:1.5rem}
.mat{display:inline-grid;grid-template-columns:repeat(2,auto);gap:6px 24px;padding:8px 18px;border-left:3px solid var(--ink);border-right:3px solid var(--ink);border-radius:8px;font-size:1.8rem;font-weight:700}
.xpbox{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin:14px 0;text-align:left}
.xpbig{font-size:2.1rem;font-weight:800;color:#E8590C;text-align:center}
.xpbox ul{list-style:none;padding:0;margin:8px 0 0}.xpbox li{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}
.naik{background:var(--good-bg);border:2px solid var(--good);border-radius:14px;padding:10px 14px;margin:8px 0;text-align:left;font-weight:600}
.badge-new{display:flex;align-items:center;gap:12px;background:var(--hl);border-radius:14px;padding:10px 14px;margin:8px 0;text-align:left;animation:pop .5s}
.badge-new .bi{font-size:2rem}
.vsbox{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px;margin:12px 0}
.vsbox b{font-size:2.2rem;display:block}.vsbox .vs{font-size:2rem}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btnrow .mix,.btnrow .plain{margin:6px 0;text-align:center}

<script>
let rnd=Math.random;

const R=(a,b)=>Math.floor(rnd()*(b-a+1))+a;
const pick=a=>a[R(0,a.length-1)];
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=R(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const lcm=(a,b)=>a/gcd(a,b)*b;
const rb=n=>n.toLocaleString('id-ID');
const sg=n=>n<0?'−'+rb(-n):rb(n===0?0:n);
const F=(n,d)=>`<span class="fr"><span>${n}</span><span>${d}</span></span>`;
const fmt=s=>String(s).replace(/(\d+)\/(\d+)/g,(m,a,b)=>F(a,b));
const fr=(n,d)=>{const g=gcd(n,d);n/=g;d/=g;if(d===1)return String(n);if(n>d){const w=Math.floor(n/d);return `${w} ${n-w*d}/${d}`}return `${n}/${d}`};
const BOX='<span class="box">?</span>';

function digitwise(a,b,f){let r=0,m=1;while(a>0||b>0){r+=f(a%10,b%10)*m;a=Math.floor(a/10);b=Math.floor(b/10);m*=10}return r}
function numOpts(ans,extras=[],neg=false){
  const out=[ans];
  const add=v=>{if(out.length<4&&Number.isInteger(v)&&!out.includes(v)&&(neg||v>=0))out.push(v)};
  extras.forEach(add);
  const d=shuffle([1,-1,2,-2,10,-10,5,-5,3,-3]);
  if(Math.abs(ans)>=100)d.unshift(...shuffle([100,-100,20,-20]));
  d.forEach(x=>add(ans+x));
  let g=11;while(out.length<4)add(ans+g++);
  return out.map(sg);
}
function strOpts(ans,extras){const out=[ans];extras.forEach(e=>{if(out.length<4&&e&&!out.includes(e))out.push(e)});return out}

// ---------- gambar ----------
function pie(n,k){
  const c=60,r=54;let s='';
  for(let i=0;i<n;i++){
    const a1=i/n*2*Math.PI-Math.PI/2,a2=(i+1)/n*2*Math.PI-Math.PI/2;
    const x1=c+r*Math.cos(a1),y1=c+r*Math.sin(a1),x2=c+r*Math.cos(a2),y2=c+r*Math.sin(a2);
    s+=`<path d="M${c} ${c} L${x1.toFixed(2)} ${y1.toFixed(2)} A${r} ${r} 0 0 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${i<k?'var(--shade)':'var(--card)'}" stroke="var(--ink)" stroke-width="2.5" stroke-linejoin="round"/>`;
  }
  return `<svg viewBox="0 0 120 120" width="170" height="170" role="img" aria-label="Lingkaran dibagi ${n} bagian sama besar, ${k} bagian diarsir">${s}</svg>`;
}
function rectSVG(p,l){
  const w=70+p*11,h=34+l*9,x=(300-w)/2,y=22;
  return `<svg viewBox="0 0 300 ${h+60}" width="300" role="img" aria-label="Persegi panjang dengan panjang ${p} cm dan lebar ${l} cm">
  <rect x="${x}" y="${y}" width="${w}" height="${h}" fill="var(--hl)" fill-opacity=".45" stroke="var(--ink)" stroke-width="2.5" rx="2"/>
  <text x="150" y="${y+h+28}" text-anchor="middle" fill="var(--ink)" font-size="17" font-family="Fredoka,sans-serif">${p} cm</text>
  <text x="${x+w+8}" y="${y+h/2+6}" fill="var(--ink)" font-size="17" font-family="Fredoka,sans-serif">${l} cm</text></svg>`;
}
function barChart(names,vals,title){
  const L=36,B=176,T=32,u=(B-T)/10,W=320;
  let s=`<text x="${W/2}" y="16" text-anchor="middle" font-size="14" font-weight="600" fill="var(--ink)">${title}</text>`;
  for(let v=0;v<=10;v++){const y=B-v*u;s+=`<line x1="${L}" y1="${y}" x2="${W-6}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-8}" y="${y+4}" text-anchor="end" font-size="11" fill="var(--muted)">${v}</text>`}
  const cols=['var(--k3)','var(--k4)','var(--k5)','var(--k6)'],slot=(W-6-L)/names.length,bw=slot*.55;
  names.forEach((n,i)=>{const x=L+i*slot+(slot-bw)/2,h=vals[i]*u;
    s+=`<rect class="growbar" style="animation-delay:${i*.08}s" x="${x.toFixed(1)}" y="${(B-h).toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" rx="4" fill="${cols[i]}"/><text x="${(x+bw/2).toFixed(1)}" y="${B+18}" text-anchor="middle" font-size="12" fill="var(--ink)">${n}</text>`});
  s+=`<line x1="${L}" y1="${B}" x2="${W-6}" y2="${B}" stroke="var(--ink)" stroke-width="2"/><line x1="${L}" y1="${T-6}" x2="${L}" y2="${B}" stroke="var(--ink)" stroke-width="2"/>`;
  return `<svg viewBox="0 0 ${W} 200" width="320" role="img" aria-label="Diagram batang ${title}" style="font-family:Fredoka,sans-serif">${s}</svg>`;
}
function fracBars(list){
  const W=300,h=28;let s='';
  list.forEach(([n,d],k)=>{const y=8+k*44,x0=56,w=(W-x0-6)/d;
    s+=`<text x="6" y="${y+20}" font-size="16" fill="var(--ink)" font-family="Fredoka,sans-serif">${n}/${d}</text>`;
    for(let i=0;i<d;i++)s+=`<rect x="${(x0+i*w).toFixed(1)}" y="${y}" width="${w.toFixed(1)}" height="${h}" fill="${i<n?'var(--shade)':'var(--card)'}" stroke="var(--ink)" stroke-width="2"/>`});
  return `<svg viewBox="0 0 ${W} ${list.length*44+6}" width="300" role="img" aria-label="Gambar perbandingan dua pecahan">${s}</svg>`;
}

// ---------- suara lucu (dibuat langsung oleh browser, tanpa file) ----------
const SFX=(()=>{
  let ctx=null;
  const on=()=>!data.mute;
  function ac(){
    if(AMAN)return null;
    if(!ctx){const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;try{ctx=new C()}catch(e){return null}}
    if(ctx.state==='suspended')ctx.resume();
    return ctx;
  }
  function tone(f,start,dur,o={}){
    const c=ac();if(!c)return;
    const {type='sine',vol=.16,slide=0,attack=.012}=o,t=c.currentTime+start;
    const osc=c.createOscillator(),g=c.createGain();
    osc.type=type;osc.frequency.setValueAtTime(f,t);
    if(slide)osc.frequency.exponentialRampToValueAtTime(Math.max(40,f*slide),t+dur);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
    osc.connect(g);g.connect(c.destination);osc.start(t);osc.stop(t+dur+.03);
  }
  const notes=(arr,step,o,at=0)=>arr.forEach((f,i)=>tone(f,at+i*step,o.dur||.18,o));
  return{
    tap(){if(on())tone(560,0,.07,{type:'triangle',vol:.1,slide:1.7})},
    right(){if(!on())return;notes([523,659,784,1047],.07,{type:'triangle',vol:.15,dur:.2});tone(1568,.3,.3,{vol:.05})},
    streak(){if(!on())return;notes([523,659,784,1047,1319,1568],.06,{type:'square',vol:.055,dur:.16});notes([1047,1568,2093],.1,{type:'triangle',vol:.1,dur:.3},.36)},
    wrong(){if(!on())return;tone(392,0,.2,{type:'triangle',vol:.15,slide:.75});tone(294,.18,.35,{type:'triangle',vol:.13,slide:.6})},
    giggle(){if(!on())return;[0,1,2,3,4].forEach(i=>tone(700+i*90,i*.07,.07,{type:'square',vol:.04,slide:1.4}))},
    star(i){if(on())tone(784*Math.pow(1.26,i),0,.28,{type:'sine',vol:.16,slide:1.5})},

  if(rnd()<.5){const a=R(2,9),b=R(2,9),c=R(1,a+b-1),n=a+b-c,t=k=>k===1?'x':k+'x';return{q:`${a}x + ${b}x − ${c}x = ?`,opts:strOpts(t(n),[t(a+b+c),t(a+b),t(n+1),`${n}`]),expl:`Suku-suku sejenis (sama-sama x) dihitung koefisiennya: ${a} + ${b} − ${c} = ${n}. Jadi ${t(n)}.`}}
  const k=R(2,6),b=R(1,9);return{q:`${k}(x + ${b}) = ?`,opts:strOpts(`${k}x + ${k*b}`,[`${k}x + ${b}`,`x + ${k*b}`,`${k}x + ${k+b}`]),expl:`Kalikan ${k} ke setiap suku di dalam kurung: ${k} × x = ${k}x dan ${k} × ${b} = ${k*b}. Jadi ${k}x + ${k*b}.`}}},
{id:'k7_plsv',g:7,name:'Persamaan linear satu variabel',icon:'⚖️',gen(){const a=R(2,9),x=R(-5,12),b=nz(-15,20),c=a*x+b;
  return{q:`${a}x ${pm(b)} = ${sg(c)}, maka x = ?`,opts:numOpts(x,[(c+b)/a,-x,x+1],true),expl:`Pindahkan ${sg(b)} ke ruas kanan dengan tanda kebalikannya: ${a}x = ${sg(c)} ${pm(-b)} = ${sg(c-b)}. Lalu bagi dengan ${a}: x = ${sg(c-b)} : ${a} = ${sg(x)}.`}}},
{id:'k7_banding',g:7,name:'Perbandingan senilai dan berbalik nilai',icon:'👷',gen(){
  if(rnd()<.5){const p=R(2,6),h=pick([6,8,10,12,15,20,24]);let q;do{q=R(2,12)}while(q===p||(p*h)%q);const v=p*h/q;
    return{q:`${p} pekerja menyelesaikan pekerjaan dalam ${h} hari. Jika ada ${q} pekerja, berapa hari pekerjaan selesai?`,opts:unit(numOpts(v,[h*q/p,h+q-p,v+1]),' hari'),expl:`Ini perbandingan berbalik nilai: makin banyak pekerja, makin cepat selesai. ${p} × ${h} = ${p*h}. Lalu ${p*h} : ${q} = ${v} hari.`}}
  const a=R(2,6),hrg=pick([2500,3000,4000,5000,7500]),b=R(a+1,12);
  return{q:`Harga ${a} kg gula ${rp(a*hrg)}. Berapa harga ${b} kg?`,opts:numOpts(b*hrg,[a*hrg+b,b*hrg+hrg,b*hrg-hrg]).map(v=>'Rp'+v),expl:`Ini perbandingan senilai. Harga 1 kg = ${rp(a*hrg)} : ${a} = ${rp(hrg)}. Harga ${b} kg = ${b} × ${rp(hrg)} = ${rp(b*hrg)}.`}}},
{id:'k7_sudut',g:7,name:'Sudut berpelurus dan berpenyiku',icon:'📐',gen(){
  if(rnd()<.5){const a=R(10,170);return{q:`Pelurus sudut ${a}° adalah ?`,opts:unit(numOpts(180-a,[90-a,360-a,190-a]),'°'),expl:`Dua sudut berpelurus jumlahnya 180°. Jadi 180° − ${a}° = ${180-a}°.`}}
  const a=R(5,85);return{q:`Penyiku sudut ${a}° adalah ?`,opts:unit(numOpts(90-a,[180-a,100-a,a]),'°'),expl:`Dua sudut berpenyiku jumlahnya 90°. Jadi 90° − ${a}° = ${90-a}°.`}}},
{id:'k7_diskon',g:7,name:'Diskon, untung, dan rugi',icon:'🏷️',gen(){
  if(rnd()<.5){const h=pick([40,50,60,80,100,120,150,200])*1000,d=pick([10,20,25,30,40,50]),pot=h*d/100;return{q:`Sepatu seharga ${rp(h)} didiskon ${d}%. Berapa yang harus dibayar?`,opts:numOpts(h-pot,[pot,h-d*1000,h-pot+5000]).map(v=>'Rp'+v),expl:`Potongan = ${d}% × ${rp(h)} = ${rp(pot)}. Yang dibayar = ${rp(h)} − ${rp(pot)} = ${rp(h-pot)}.`}}
  const beli=pick([20,25,40,50,80,100])*1000,p=pick([10,20,25,50]),u=rnd()<.6,jual=u?beli+beli*p/100:beli-beli*p/100;
  return{q:`Pedagang membeli barang ${rp(beli)} dan menjualnya ${rp(jual)}. Berapa persen ${u?'untungnya':'ruginya'}?`,opts:unit(numOpts(p,[p+5,p*2,100-p]),'%'),expl:`${u?'Untung':'Rugi'} = ${rp(Math.abs(jual-beli))}. Persentase = ${rp(Math.abs(jual-beli))} : ${rp(beli)} × 100% = ${p}%.`}}},
// ===== Kelas 8 =====
{id:'k8_pola',g:8,name:'Pola bilangan (suku ke-n)',icon:'🔁',gen(){const a=R(1,12),b=R(2,9),n=pick([10,12,15,20,25]),un=a+(n-1)*b;
  return{q:`Pola: ${a}, ${a+b}, ${a+2*b}, ${a+3*b}, … Suku ke-${n} adalah ?`,opts:numOpts(un,[a+n*b,un-b,n*b]),expl:`Suku pertama a = ${a}, beda b = ${b}. U<sub>n</sub> = a + (n − 1)b = ${a} + (${n} − 1) × ${b} = ${a} + ${(n-1)*b} = ${un}.`}}},
{id:'k8_fungsi',g:8,name:'Nilai fungsi',icon:'📈',gen(){const a=R(2,7)*(rnd()<.3?-1:1),b=R(-9,12),k=R(-5,8),n=a*k+b;
  return{q:`f(x) = ${lin(a,b)}. Nilai f(${sg(k)}) = ?`,opts:numOpts(n,[a*k-b,a+k+b,-n],true),expl:`Ganti x dengan ${sg(k)}: f(${sg(k)}) = ${sg(a)} × ${par(k)}${b===0?'':' '+pm(b)} = ${sg(a*k)}${b===0?'':' '+pm(b)} = ${sg(n)}.`}}},
{id:'k8_gradien',g:8,name:'Gradien garis',icon:'📉',gen(){const m=nz(-4,5),x1=R(-5,5),y1=R(-5,5),dx=R(1,4),x2=x1+dx,y2=y1+m*dx,P=(x,y)=>`(${sg(x)}, ${sg(y)})`;
  return{q:`Gradien garis yang melalui ${P(x1,y1)} dan ${P(x2,y2)} adalah ?`,opts:numOpts(m,[-m,dx,m+1],true),expl:`m = (y<sub>2</sub> − y<sub>1</sub>) : (x<sub>2</sub> − x<sub>1</sub>) = (${sg(y2)} − ${par(y1)}) : (${sg(x2)} − ${par(x1)}) = ${sg(y2-y1)} : ${dx} = ${sg(m)}.`}}},
{id:'k8_spldv',g:8,name:'Sistem persamaan dua variabel',icon:'🔀',gen(){const x=R(1,12),y=R(1,12),s=x+y,d=x-y,ask=rnd()<.5?'x':'y',ans=ask==='x'?x:y;
  return{q:`x + y = ${s} dan x − y = ${sg(d)}. Nilai ${ask} = ?`,opts:numOpts(ans,[ask==='x'?y:x,s,ans+1],true),expl:`Jumlahkan kedua persamaan: 2x = ${s} + ${par(d)} = ${s+d}, jadi x = ${x}. Lalu y = ${s} − ${x} = ${y}. Jadi ${ask} = ${ans}.`}}},
{id:'k8_pyth',g:8,name:'Teorema Pythagoras',icon:'📐',gen(){const [a,b,c]=pick([[3,4,5],[6,8,10],[5,12,13],[8,15,17],[9,12,15],[7,24,25],[12,16,20]]);
  if(rnd()<.5)return{q:`Sisi tegak segitiga siku-siku ${a} cm dan ${b} cm. Panjang sisi miringnya?`,visual:triSVG(a,b,'?'),opts:unit(numOpts(c,[a+b,c+1,b]),' cm'),expl:`c${sup(2)} = a${sup(2)} + b${sup(2)} = ${a*a} + ${b*b} = ${c*c}. Jadi c = √${c*c} = ${c} cm.`};
  return{q:`Sisi miring segitiga siku-siku ${c} cm dan satu sisi tegaknya ${a} cm. Panjang sisi tegak lainnya?`,visual:triSVG(a,'?',c),opts:unit(numOpts(b,[c-a,c+a,b+1]),' cm'),expl:`b${sup(2)} = c${sup(2)} − a${sup(2)} = ${c*c} − ${a*a} = ${b*b}. Jadi b = √${b*b} = ${b} cm.`}}},
{id:'k8_stat',g:8,name:'Median dan modus',icon:'📊',gen(){const vals=shuffle([4,5,6,7,8,9,10]).slice(0,5),mo=pick(vals),v=shuffle([...vals,mo,mo]),s=v.slice().sort((x,y)=>x-y),med=s[3];
  if(rnd()<.5)return{q:`Data nilai: ${v.join(', ')}. Modusnya adalah ?`,opts:numOpts(mo,[med,s[6],s[0]]),expl:`Modus adalah nilai yang paling sering muncul. ${mo} muncul 3 kali, nilai lain hanya sekali. Jadi modusnya ${mo}.`};
  return{q:`Data nilai: ${v.join(', ')}. Mediannya adalah ?`,opts:numOpts(med,[mo,s[2],s[4]]),expl:`Urutkan dulu: ${s.join(', ')}. Ada 7 data, jadi median adalah data ke-4, yaitu ${med}.`}}},
{id:'k8_peluang',g:8,name:'Peluang sederhana',icon:'🎲',gen(){const [d,set]=pick([['mata dadu genap',[2,4,6]],['mata dadu ganjil',[1,3,5]],['mata dadu lebih dari 4',[5,6]],['mata dadu kurang dari 3',[1,2]],['mata dadu prima',[2,3,5]],['mata dadu 6',[6]],['mata dadu faktor dari 6',[1,2,3,6]]]),k=set.length,s=fr(k,6);
  return{q:`Sebuah dadu dilempar sekali. Peluang muncul ${d} adalah ?`,opts:strOpts(s,[fr(6-k,6),fr(k,12),fr(1,k+1),fr(k+1,6)].filter(x=>x!==s)),expl:`Kejadian yang diharapkan: ${set.join(', ')} (ada ${k}). Semua kemungkinan ada 6. Peluang = ${k}/6${s!==`${k}/6`?` = ${s}`:''}.`}}},
// ===== Kelas 9 =====
{id:'k9_pangkat',g:9,name:'Bilangan berpangkat',icon:'🔺',gen(){const f=R(0,2);
  if(f===0){const a=pick([2,3,5]),m=R(1,4),n=R(1,3),e=m+n;return{q:`${a}${sup(m)} × ${a}${sup(n)} = ?`,opts:numOpts(a**e,[a**(m*n),a**e*a,a**(e-1)]),expl:`Perkalian dengan bilangan pokok sama: pangkatnya dijumlahkan. ${a}${sup(m)} × ${a}${sup(n)} = ${a}${sup(e)} = ${rb(a**e)}.`}}
  if(f===1){const a=pick([2,3,4,5,10]),n=pick([2,3]);return{q:`${a}${sup('−'+n)} = ?`,opts:strOpts(`1/${a**n}`,[`−${rb(a**n)}`,`${rb(a**n)}`,`1/${a*n}`,`−1/${a**n}`]),expl:`Pangkat negatif berarti kebalikan: ${a}${sup('−'+n)} = 1/${a}${sup(n)} = 1/${a**n}.`}}
  const a=R(2,12);return{q:`${a}${sup(0)} + ${a}${sup(1)} = ?`,opts:numOpts(1+a,[a,2*a,a+2]),expl:`Bilangan (bukan nol) pangkat 0 hasilnya 1, dan pangkat 1 hasilnya bilangan itu sendiri. Jadi 1 + ${a} = ${1+a}.`}}},
{id:'k9_akar',g:9,name:'Bentuk akar',icon:'√',gen(){
  if(rnd()<.5){const n=R(2,20);return{q:`√${n*n} = ?`,opts:numOpts(n,[n*2,n+1,n-1]),expl:`Cari bilangan yang jika dikuadratkan hasilnya ${n*n}: ${n} × ${n} = ${n*n}. Jadi √${n*n} = ${n}.`}}
  const a=R(2,7),b=pick([2,3,5,6,7]),v=a*a*b;return{q:`Bentuk sederhana dari √${v} adalah ?`,opts:strOpts(`${a}√${b}`,[`${b}√${a}`,`${a*a}√${b}`,`${a}√${b*2}`,`${a+1}√${b}`]),expl:`Pecah menjadi kuadrat sempurna: √${v} = √(${a*a} × ${b}) = √${a*a} × √${b} = ${a}√${b}.`}}},
{id:'k9_kuadrat',g:9,name:'Akar persamaan kuadrat',icon:'🧩',gen(){let p=R(-6,8),q=R(-6,8);if(p===q)q=p+2;const r1=Math.min(p,q),r2=Math.max(p,q),b=-(r1+r2),c=r1*r2;
  const term=(k,s)=>k===0?'':`${k<0?' − ':' + '}${Math.abs(k)===1&&s?'':Math.abs(k)}${s}`,A=(x,y)=>`${sg(x)} dan ${sg(y)}`,fx=r=>r===0?'x':`(x ${pm(-r)})`;
  return{q:`Akar-akar x${sup(2)}${term(b,'x')}${term(c,'')} = 0 adalah ?`,opts:strOpts(A(r1,r2),[A(-r2,-r1),A(r1,-r2),A(r1+1,r2),A(-r1,r2)]),
  expl:`Cari dua bilangan yang jumlahnya ${sg(-b)} dan hasil kalinya ${sg(c)}, yaitu ${sg(r1)} dan ${sg(r2)}. Jadi ${fx(r1)}${fx(r2)} = 0, akarnya x = ${sg(r1)} atau x = ${sg(r2)}.`}}},
{id:'k9_puncak',g:9,name:'Titik puncak fungsi kuadrat',icon:'⛰️',gen(){const h=R(-5,5),k=R(-9,9),b=-2*h,c=h*h+k,term=(v,s)=>v===0?'':`${v<0?' − ':' + '}${Math.abs(v)}${s}`,P=(x,y)=>`(${sg(x)}, ${sg(y)})`;
  return{q:`Titik puncak grafik y = x${sup(2)}${term(b,'x')}${term(c,'')} adalah ?`,opts:strOpts(P(h,k),[P(-h,k),P(h,c),P(k,h),P(h,-k)]),
  expl:`x puncak = −b : (2a) = ${sg(-b)} : 2 = ${sg(h)}. Masukkan ke fungsi: y = (${sg(h)})${sup(2)}${term(b,`(${sg(h)})`)}${term(c,'')} = ${sg(k)}. Jadi titik puncaknya ${P(h,k)}.`}}},
{id:'k9_tabung',g:9,name:'Volume tabung, kerucut, bola',icon:'🥫',gen(){const f=R(0,2);
  if(f===0){const r=pick([7,14]),t=pick([10,12,15,20]),v=22*r*r*t/7;return{q:`Volume tabung berjari-jari ${r} cm dan tinggi ${t} cm adalah ? (π = 22/7)`,opts:unit(numOpts(v,[v/2,2*22*r*t/7,v*2]),' cm³'),expl:`V = π × r × r × t = 22/7 × ${r} × ${r} × ${t} = ${rb(v)} cm³.`}}
  if(f===1){const r=pick([7,14]),t=pick([6,9,12,15,21,30]),v=22*r*r*t/21;return{q:`Volume kerucut berjari-jari ${r} cm dan tinggi ${t} cm adalah ? (π = 22/7)`,opts:unit(numOpts(v,[v*3,v/2,v+r]),' cm³'),expl:`V = 1/3 × π × r × r × t = 1/3 × 22/7 × ${r} × ${r} × ${t} = ${rb(v)} cm³.`}}
  const r=21,v=88*r**3/21;return{q:`Volume bola berjari-jari ${r} cm adalah ? (π = 22/7)`,opts:unit(numOpts(v,[v*3/4,4*22*r*r/7,v/2]),' cm³'),expl:`V = 4/3 × π × r³ = 4/3 × 22/7 × ${r} × ${r} × ${r} = ${rb(v)} cm³.`}}},
{id:'k9_sebangun',g:9,name:'Kesebangunan',icon:'🔍',gen(){const a=R(2,6),b=R(a+1,10),k=R(2,4);
  return{q:`Dua persegi panjang sebangun. Yang kecil berukuran panjang ${b} cm dan lebar ${a} cm. Jika panjang yang besar ${b*k} cm, berapa lebarnya?`,opts:unit(numOpts(a*k,[a+b*k-b,b*k-a,a*k+1]),' cm'),expl:`Faktor perbesaran = ${b*k} : ${b} = ${k}. Lebar yang besar = ${a} × ${k} = ${a*k} cm.`}}},
{id:'k9_transformasi',g:9,name:'Transformasi titik',icon:'🪞',gen(){const x=nz(-6,6),y=nz(-6,6),P=(p,q)=>`(${sg(p)}, ${sg(q)})`,f=R(0,2);
  if(f===0){const a=nz(-5,5),b=nz(-5,5);return{q:`Titik ${P(x,y)} ditranslasi oleh (${sg(a)}, ${sg(b)}). Bayangannya adalah ?`,opts:strOpts(P(x+a,y+b),[P(x-a,y-b),P(x+b,y+a),P(a,b),P(x*a,y*b)]),expl:`Translasi berarti menambahkan pergeserannya: (${sg(x)} + ${par(a)}, ${sg(y)} + ${par(b)}) = ${P(x+a,y+b)}.`}}
  if(f===1)return{q:`Bayangan titik ${P(x,y)} oleh pencerminan terhadap sumbu x adalah ?`,opts:strOpts(P(x,-y),[P(-x,y),P(-x,-y),P(y,x)]),expl:`Pencerminan terhadap sumbu x: x tetap, tanda y dibalik. Jadi ${P(x,-y)}.`};
  return{q:`Bayangan titik ${P(x,y)} oleh pencerminan terhadap sumbu y adalah ?`,opts:strOpts(P(-x,y),[P(x,-y),P(-x,-y),P(y,x)]),expl:`Pencerminan terhadap sumbu y: y tetap, tanda x dibalik. Jadi ${P(-x,y)}.`}}},
// ===== Kelas 10 =====
{id:'k10_eksponen',g:10,name:'Persamaan eksponen',icon:'🚀',gen(){const a=pick([2,3,5]),x=R(1,6),v=a**x;
  if(rnd()<.5)return{q:`${a}${sup('x')} = ${rb(v)}, maka x = ?`,opts:numOpts(x,[x+1,x-1,x+2]),expl:`Ubah ${rb(v)} menjadi pangkat ${a}: ${rb(v)} = ${a}${sup(x)}. Karena bilangan pokoknya sama, x = ${x}.`};
  const k=R(1,4);return{q:`${a}${sup('x + '+k)} = ${rb(a**(x+k))}, maka x = ?`,opts:numOpts(x,[x+k,x+1,k]),expl:`${rb(a**(x+k))} = ${a}${sup(x+k)}. Jadi x + ${k} = ${x+k}, maka x = ${x}.`}}},
{id:'k10_log',g:10,name:'Logaritma',icon:'📚',gen(){const a=pick([2,3,5,10]),n=R(1,5),L=(b,x)=>`${b===10?'':sup(b)}log ${rb(x)}`;
  if(rnd()<.5)return{q:`${L(a,a**n)} = ?`,opts:numOpts(n,[n+1,n-1,a]),expl:`${L(a,a**n)} artinya: ${a} dipangkatkan berapa supaya hasilnya ${rb(a**n)}? Karena ${a}${sup(n)} = ${rb(a**n)}, jawabannya ${n}.`};
  const m=R(1,4);return{q:`${L(a,a**n)} + ${L(a,a**m)} = ?`,opts:numOpts(n+m,[n*m,n+m+1,Math.abs(n-m)]),expl:`${L(a,a**n)} = ${n} dan ${L(a,a**m)} = ${m}. Jadi ${n} + ${m} = ${n+m}. Bisa juga memakai sifat log a + log b = log (a × b).`}}},
{id:'k10_deret',g:10,name:'Barisan dan deret aritmetika',icon:'🪜',gen(){const a=R(1,10),b=R(2,6),n=pick([8,10,12,15,20]),un=a+(n-1)*b,sn=n*(a+un)/2;
  if(rnd()<.5)return{q:`Barisan ${a}, ${a+b}, ${a+2*b}, … Suku ke-${n} adalah ?`,opts:numOpts(un,[a+n*b,un-b,sn]),expl:`U<sub>n</sub> = a + (n − 1)b = ${a} + ${n-1} × ${b} = ${un}.`};
  return{q:`Jumlah ${n} suku pertama deret ${a} + ${a+b} + ${a+2*b} + … adalah ?`,opts:numOpts(sn,[un,n*un,sn+b]),expl:`U<sub>${n}</sub> = ${a} + ${n-1} × ${b} = ${un}. S<sub>n</sub> = n/2 × (a + U<sub>n</sub>) = ${n}/2 × (${a} + ${un}) = ${rb(sn)}.`}}},
{id:'k10_geometri',g:10,name:'Barisan geometri',icon:'🧬',gen(){const a=R(1,5),r=pick([2,3]),n=R(4,7),un=a*r**(n-1);
  return{q:`Barisan ${a}, ${a*r}, ${a*r*r}, … Suku ke-${n} adalah ?`,opts:numOpts(un,[a*r**n,un/r,a+(n-1)*r]),expl:`Rasio r = ${a*r} : ${a} = ${r}. U<sub>n</sub> = a × r${sup('n − 1')} = ${a} × ${r}${sup(n-1)} = ${rb(un)}.`}}},
{id:'k10_trigo',g:10,name:'Trigonometri sudut istimewa',icon:'📐',gen(){const f=pick(['sin','cos','tan']),d=pick(Object.keys(TRIG[f])),ans=TRIG[f][d],pool=['0','1/2','1/2 √2','1/2 √3','1','√3','1/3 √3'];
  const rumus=f==='sin'?'sisi depan : sisi miring':f==='cos'?'sisi samping : sisi miring':'sisi depan : sisi samping';
  const seg=d==='45'?'Pada segitiga siku-siku sama kaki, sisi-sisinya 1, 1, dan √2.':(d==='30'||d==='60')?'Pada segitiga 30°-60°-90°, sisi di depan 30° = 1, di depan 60° = √3, dan sisi miring = 2.':'Sudut 0° dan 90° adalah sudut batas yang perlu dihafal.';
  return{q:`${f} ${d}° = ?`,opts:strOpts(ans,shuffle(pool.filter(x=>x!==ans))),expl:`${f} = ${rumus}. ${seg} Jadi ${f} ${d}° = ${ans}.`}}},
{id:'k10_komposisi',g:10,name:'Fungsi komposisi',icon:'🔗',gen(){const a=R(2,5),b=R(-6,6),c=R(2,4),d=R(-5,5),k=R(-3,4),gk=c*k+d,ans=a*gk+b;
  return{q:`f(x) = ${lin(a,b)} dan g(x) = ${lin(c,d)}. Nilai (f ∘ g)(${sg(k)}) = ?`,opts:numOpts(ans,[c*(a*k+b)+d,a*k+b+gk,ans+a],true),

  if(p.xp>=1000)beri('xp1000');if(c.mode==='kilat'&&c.skor>=15)beri('kilat15');if(c.mode==='cocok'&&c.salah===0)beri('cocok');if(c.menang)beri('menang');
  return baru}
function setColor(l=P().level){document.documentElement.style.setProperty('--c',jOf(l).c)}

// ---------- angka acak berbiji (untuk tantangan) ----------
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function denganSeed(seed,fn){const lama=rnd;rnd=mulberry(seed+12345);try{return fn()}finally{rnd=lama}}
const C32='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
const cek32=b=>C32[b.split('').reduce((a,c)=>a*7+C32.indexOf(c),3)%32];
function kodeTantangan(seed,level,ti,skor){let n=((skor*32+ti)*16+level)*1048576+seed,s='';for(let i=0;i<7;i++){s=C32[n%32]+s;n=Math.floor(n/32)}return `JM-${s.slice(0,4)}-${s.slice(4)}${cek32(s)}`}
function bacaKode(str){let s=String(str||'').toUpperCase().replace(/O/g,'0').replace(/[IL]/g,'1').replace(/[^0-9A-Z]/g,'');if(s.length===10&&s.startsWith('JM'))s=s.slice(2);if(s.length!==8)return null;
  const body=s.slice(0,7);if([...body].some(c=>C32.indexOf(c)<0)||cek32(body)!==s[7])return null;let n=0;for(const c of body)n=n*32+C32.indexOf(c);
  const seed=n%1048576;n=Math.floor(n/1048576);const level=n%16;n=Math.floor(n/16);const ti=n%32,skor=Math.floor(n/32);
  if(level>12||skor>10)return null;if(ti!==31&&!topikLevel(level)[ti])return null;return{seed,level,ti,skor}}

let S=null;const UI={};
function pilihBerbobot(ts){const w=ts.map(t=>[1.6,2.4,1.4,.6][hafal(t.id)]);let r=rnd()*w.reduce((a,b)=>a+b,0);for(let i=0;i<ts.length;i++){r-=w[i];if(r<=0)return ts[i]}return ts[ts.length-1]}
function buatGen(t){for(let i=0;i<8;i++){try{const g=t.gen();if(g&&g.opts&&g.opts.length>=2)return g}catch(e){}}return null}
function buatSoal(t){const g=buatGen(t);if(!g)return null;const right=g.opts[0],opts=shuffle(g.opts.slice());return{t,g,opts,correct:opts.indexOf(right),label:g.label||t.label}}
const RE_ISIAN=/^(Rp)?(−?\d[\d.]*(?:,\d+)?)( ?(?:cm²|cm³|cm|km\/jam|km|kg|g|m|jam|hari|kali|°|%))?$/;
function targetIsian(a){const m=String(a).match(RE_ISIAN);return m?{nilai:m[2].replace(/\./g,''),depan:m[1]||'',belakang:(m[3]||'').trim()}:null}
const teksPolos=s=>String(s).replace(/<[^>]+>/g,'');
const cocokOK=g=>!g.visual&&g.q&&teksPolos(g.q).length<=26&&teksPolos(g.opts[0]).length<=16;
const cacheCocok={};
function bisaCocok(ts){const key=ts.map(t=>t.id).join(',');if(key in cacheCocok)return cacheCocok[key];const seen=new Set();for(let i=0;i<40&&seen.size<4;i++){const g=buatGen(pick(ts));if(g&&cocokOK(g))seen.add(g.opts[0])}return cacheCocok[key]=seen.size>=4}

function mulai(mode,topicId,ext={}){
  const level=ext.level??P().level,all=topikLevel(level),ts=topicId?[TOPICS.find(t=>t.id===topicId)]:all;
  const berbiji=ext.seed!=null||!!topicId||!!ext.arena,seed=ext.seed??Math.floor(Math.random()*1048576);
  const pilih=()=>ts.length===1?ts[0]:(berbiji?pick(ts):pilihBerbobot(ts));
  S={mode,topicId,level,ti:topicId?all.findIndex(t=>t.id===topicId):31,seed,chal:ext.chal||null,arena:!!ext.arena,ts,i:0,skor:0,xp:0,combo:0,maxCombo:0,salah:0,wrongs:[],items:[],dijawab:false,
     hafalAwal:Object.fromEntries(ts.map(t=>[t.id,hafal(t.id)])),bisaTantang:mode==='kuis'&&berbiji&&!ext.chal};
  setColor(level);
  const isi=()=>{
    if(mode==='kuis'||mode==='bs'){for(let k=0;k<10;k++){const q=buatSoal(pilih());if(!q)continue;
      if(mode==='kuis')q.isian=level>=2&&!!targetIsian(q.g.opts[0])&&rnd()<.35;
      else{q.benar=rnd()<.5;q.cand=q.benar?q.g.opts[0]:q.g.opts[1+Math.floor(rnd()*(q.g.opts.length-1))]}
      S.items.push(q)}}
    else if(mode==='cocok'){const seen=new Set();for(let k=0;k<90&&S.items.length<5;k++){const t=pilih(),g=buatGen(t);if(!g||!cocokOK(g)||seen.has(g.opts[0]))continue;seen.add(g.opts[0]);S.items.push({t,g,opts:g.opts,correct:0,label:g.label||t.label})}}
  };
  berbiji?denganSeed(seed,isi):isi();
  if(mode==='cocok'&&S.items.length<4){S.mode='kuis';S.items=[];return mulai('kuis',topicId,ext)}
  if(mode==='kilat'){S.pilih=pilih;S.akhir=Date.now()+60000;kilatBerikut(true)}
  else if(mode==='cocok')cocokTampil();else soalBerikut();
}

  <div class="xpbox"><div class="xpbig">+${total} XP</div><ul>${rincian.map(([a,b])=>`<li><span>${a}</span><b>+${b}</b></li>`).join('')}</ul>
   <div class="goal" style="margin:10px 0 0"><span>🎯 Hari ini</span><div class="gbar"><i style="width:${Math.min(100,todayXP(p)/GOAL*100)}%"></i></div><b>${Math.min(todayXP(p),GOAL)}/${GOAL}</b></div></div>

  ${S.bisaTantang?`<button class="plain" data-act="ulang">🔁 Main lagi</button>`:''}

function rrect(x,X,Y,w,h,r,fill,stroke){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();x.fillStyle=fill;x.fill();x.lineWidth=6;x.strokeStyle=stroke;x.stroke()}
function kartuHasil(r){return new Promise(res=>{let done=false;const W=720,H=900,c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d'),f='Fredoka, "Segoe UI", sans-serif';
  const gambar=img=>{x.fillStyle='#FFE066';x.fillRect(0,0,W,H);x.strokeStyle='#F2D04E';x.lineWidth=2;for(let i=0;i<=W;i+=36){x.beginPath();x.moveTo(i,0);x.lineTo(i,H);x.stroke()}for(let j=0;j<=H;j+=36){x.beginPath();x.moveTo(0,j);x.lineTo(W,j);x.stroke()}
    x.textAlign='left';x.fillStyle='#1F2A5A';x.font=`bold 46px ${f}`;x.fillText('Jago Matematika',48,96);x.font=`26px ${f}`;x.fillText('bersama Dokter Faiz',50,134);
    if(img){try{x.drawImage(img,W-188,10,160,186)}catch(e){}}
    rrect(x,48,200,W-96,600,36,'#FFFFFF','#1F2A5A');x.textAlign='center';
    x.font='92px sans-serif';x.fillText(r.av,W/2,320);x.fillStyle='#1F2A5A';x.font=`bold 42px ${f}`;x.fillText(r.nama,W/2,386);
    x.fillStyle='#55608A';x.font=`28px ${f}`;x.fillText(r.sub,W/2,430);x.fillStyle='#1F2A5A';x.font=`bold 40px ${f}`;x.fillText(r.judul,W/2,500);
    x.font='60px sans-serif';x.fillText('⭐'.repeat(r.bintang)+'☆'.repeat(3-r.bintang),W/2,586);
    x.fillStyle='#E8590C';x.font=`bold 56px ${f}`;x.fillText(`+${r.xp} XP`,W/2,672);
    x.fillStyle='#1F2A5A';x.font=`30px ${f}`;x.fillText(`Level ${r.level}  •  🔥 ${r.streak} hari beruntun`,W/2,740);x.font=`26px ${f}`;x.fillText('Latihan matematika TK sampai SMA',W/2,856)};
  const selesai=img=>{if(done)return;done=true;gambar(img);try{res(c.toDataURL('image/png'))}catch(e){if(img){gambar(null);try{res(c.toDataURL('image/png'))}catch(e2){res(null)}}else res(null)}};
  try{const im=new Image();im.onload=()=>selesai(im);im.onerror=()=>selesai(null);im.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(MASCOT.replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" ').replace(/var\(--ink\)/g,'#1F2A5A'));setTimeout(()=>selesai(null),1500)}catch(e){selesai(null)}})}
async function salin(t){try{await navigator.clipboard.writeText(t);return true}catch(e){try{const a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();const ok=document.execCommand('copy');a.remove();return ok}catch(e2){return false}}}
function bagikan(teks,gambar){
  try{if(window.JagoAndroid){if(gambar&&window.JagoAndroid.bagikanGambar){window.JagoAndroid.bagikanGambar(gambar.split(',')[1],teks);return}if(window.JagoAndroid.bagikanTeks){window.JagoAndroid.bagikanTeks(teks);return}}}catch(e){}
  if(gambar&&navigator.canShare&&window.File){try{const bin=atob(gambar.split(',')[1]),arr=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);const fl=new File([arr],'jago-matematika.png',{type:'image/png'});
    if(navigator.canShare({files:[fl]})){navigator.share({files:[fl],text:teks}).catch(()=>{});return}}catch(e){}}
  if(!gambar&&navigator.share){navigator.share({text:teks}).catch(()=>sheetBagikan(teks,gambar));return}
  sheetBagikan(teks,gambar)}
function sheetBagikan(teks,gambar){UI.teksBagi=teks;sheet(`<h2>Bagikan</h2>${gambar?`<img class="modal-img" src="${gambar}" alt="Kartu hasil latihan"><p class="small">Tekan lama gambar untuk menyimpan atau membagikannya.</p>`:''}<textarea class="inp" readonly>${esc(teks)}</textarea><button class="mix" data-act="salinTeks">📋 Salin teks</button>`)}
async function bagikanHasil(){const p=P(),r=S.ringkas;say('Sebentar, Dokter Faiz siapkan kartunya…',.1);
  const img=await kartuHasil({av:p.av,nama:p.name,sub:r.sub,judul:r.judul,bintang:r.bintang,xp:r.xp,level:lvl(p.xp),streak:streakNow(p)});
  bagikan(`${p.name} baru saja dapat ${r.judul} di Jago Matematika (${r.sub}) dan +${r.xp} XP! 🔥 ${streakNow(p)} hari beruntun. Ayo latihan matematika bareng Dokter Faiz! 🧮`,img)}
function bagikanTantangan(){const p=P(),kode=kodeTantangan(S.seed,S.level,S.ti,S.skor),topik=S.topicId?TOPICS.find(t=>t.id===S.topicId):null;
  bagikan(`⚔️ ${p.name} menantangmu di Jago Matematika!\nKuis ${LNAME(S.level)}${topik?' – '+topik.name:' – campuran'}: skor ${S.skor}/10.\nBerani kalahkan? Buka Jago Matematika → Arena → Terima tantangan, lalu masukkan kode:\n\n${kode}`,null)}

const nav=on=>`<nav class="nav">${[['belajar','📚','Belajar'],['arena','🎮','Arena'],['klasemen','🏆','Klasemen'],['saya','👤','Saya']].map(([k,i,n])=>`<button class="${k===on?'on':''}" data-act="tab" data-tab="${k}"><span>${i}</span>${n}</button>`).join('')}</nav>`;

function salam(p){const tx=todayXP(p),st=streakNow(p);if(tx>=GOAL)return `Target hari ini sudah tercapai, <b>${esc(p.name)}</b>! Mau tambah lagi? 🌟`;
  if(st>=2&&tx===0)return `🔥 ${st} hari beruntun! Latihan sedikit hari ini supaya apinya tidak padam.`;
  return pick([`Halo, <b>${esc(p.name)}</b>! Mau latihan apa hari ini?`,`Semangat, <b>${esc(p.name)}</b>! Pilih topik, lalu pilih permainannya.`,'Resep Dokter Faiz: latihan 10 menit setiap hari biar otak makin kuat!'])}

  <div class="jtabs">${JENJANG.map(x=>`<button class="jt ${x===j?'on':''}" style="--jc:${x.c}" data-act="jenjang" data-j="${x.id}">${x.name}</button>`).join('')}</div>
  ${j.levels.length>1?`<div class="ltabs"><span class="small">Kelas</span>${j.levels.map(l=>`<button class="lt ${l===L?'on':''}" data-act="level" data-l="${l}">${l}</button>`).join('')}</div>`:''}

  <div class="grid">${ts.map(t=>{const m=hafal(t.id);return `<button class="tcard" data-act="pilihMode" data-t="${t.id}"><span class="ic">${t.icon}</span><b>${t.name}</b><span class="acc">${mBar(m)} ${MNAME[m]}</span></button>`}).join('')}</div>

}
function pilihMode(tid){const t=tid?TOPICS.find(x=>x.id===tid):null,ts=t?[t]:topikLevel(P().level),bisa=bisaCocok(ts);
  let info='';if(t){const st=P().stats[t.id],m=hafal(t.id),n=st?st.b+st.s:0;info=`<p class="small">${mBar(m)} ${MNAME[m]}${n?` • ${Math.round(st.b/n*100)}% benar dari ${n} soal`:''}</p>`}
  sheet(`<h2>${t?`${t.icon} ${t.name}`:`🎲 Campuran ${LNAME(P().level)}`}</h2>${info}<div class="modes">${Object.entries(MODES).map(([k,v])=>k==='cocok'&&!bisa?'':`<button class="mode" data-act="main" data-m="${k}" data-t="${tid||''}"><span class="mi">${v.icon}</span><b>${v.name}</b><small>${v.desc}</small></button>`).join('')}</div>

function arena(){const p=P(),L=p.level;setColor(L);
  app.innerHTML=`${atasUtama(p)}<h1>🎮 Arena</h1><p class="small">Permainan campuran ${LNAME(L)}. Ganti kelas di menu Belajar.</p>
  <div class="modes">${['kilat','bs','cocok','kuis'].map(k=>k==='cocok'&&!bisaCocok(topikLevel(L))?'':`<button class="mode" data-act="main" data-m="${k}" data-t=""><span class="mi">${MODES[k].icon}</span><b>${MODES[k].name}</b><small>${MODES[k].desc}</small></button>`).join('')}</div>

function terimaTantangan(){const el=document.getElementById('kode'),c=bacaKode(el&&el.value);if(!c){SFX.wrong();el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),450);toast('Kodenya tidak dikenali. Cek lagi, ya.');return}

function klasemen(){const p=P(),mode=UI.klas||'minggu',val=x=>mode==='minggu'?weekXP(x):x.xp,ps=data.profiles.slice().sort((a,b)=>val(b)-val(a));setColor(p.level);

function saya(){const p=P(),L=lvl(p.xp),a=lvlXP(L),b=lvlXP(L+1),nh=TOPICS.filter(t=>hafal(t.id)===3).length,lv=UI.lap??p.level;setColor(p.level);

  <h2>Lencana</h2><div class="badges">${BADGES.map(x=>`<div class="bdg ${p.badges.includes(x.id)?'':'off'}"><span class="bi">${x.icon}</span><b>${x.name}</b><div class="small">${x.desc}</div></div>`).join('')}</div>

  ${topikLevel(lv).map(t=>{const st=p.stats[t.id],m=hafal(t.id,p),n=st?st.b+st.s:0,pct=n?Math.round(st.b/n*100):0,c=['nd','low','mid','ok'][m];
    return `<div class="rrow"><div class="rname"><span>${t.icon} ${t.name}</span><small>${n?`${st.b} dari ${n} benar`:'Belum dicoba'}</small></div><div class="rline"><div class="rbar"><i class="${c}" style="width:${pct}%"></i></div><span class="badge ${c}">${MNAME[m]}</span></div></div>`}).join('')}

  if(mode==='tambah'){if(data.profiles.length>=8){toast('Maksimal 8 pemain.');return}const p=baruProfil(nm,UI.av,UI.lv);data.profiles.push(p);data.cur=p.id}
  else{const p=mode==='awal'?data.profiles[0]:P();p.name=nm;p.av=UI.av;p.level=UI.lv;data.baru=false}

function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}

// ---------- tombol ----------
document.addEventListener('click',e=>{
  if(e.target.closest('#fz')&&!e.target.closest('[data-act]')){SFX.giggle();setMood('happy');say(pick(['Hehe, geli! 😆','Halo! Semangat belajarnya, ya!','Dokter Faiz siap membantu!']));return}
  const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act,d=el.dataset;
  if(!['ans','bs','key','periksa','kans','ckiri','ckanan','snd'].includes(a))SFX.tap();
  switch(a){
    case 'activate':tryActivate();break;
    case 'snd':data.mute=!data.mute;save();el.textContent=data.mute?'🔇':'🔊';if(!data.mute)SFX.right();break;
    case 'tab':bukaTab(d.tab);break;
    case 'jenjang':{const j=JENJANG.find(x=>x.id===d.j),p=P();if(!j.levels.includes(p.level))p.level=j.id==='sd'?3:j.levels[0];save();home();break}
    case 'level':P().level=+d.l;save();home();break;
    case 'pilihMode':pilihMode(d.t);break;
    case 'main':tutup();mulai(d.m,d.t||null);break;
    case 'tutup':tutup();break;
    case 'keluar':if(S&&S.timer)clearInterval(S.timer);S=null;home();break;
    case 'ans':if(S&&!S.dijawab&&S.items[S.i])jawab(+d.i===S.items[S.i].correct,el,+d.i);break;
    case 'bs':if(S&&!S.dijawab&&S.items[S.i])jawab((d.v==='1')===S.items[S.i].benar,el,-1);break;
    case 'key':if(S)tekan(d.k);break;
    case 'periksa':periksa();break;
    case 'lanjut':if(S)soalBerikut();break;
    case 'kans':if(S&&S.cur)kilatJawab(+d.i,el);break;
    case 'ckiri':cocokPilih('k',+d.i,el);break;
    case 'ckanan':cocokPilih('a',+d.i,el);break;
    case 'ulang':{const s=S;mulai(s.mode,s.topicId,{level:s.level,arena:s.arena});break}
    case 'menu':home();break;
    case 'bagikan':bagikanHasil();break;
    case 'tantang':bagikanTantangan();break;
    case 'salinTeks':salin(UI.teksBagi||'').then(ok=>toast(ok?'Teks disalin':'Gagal menyalin'));break;
    case 'buatTantangan':mulai('kuis',null,{arena:true});break;
    case 'terima':terimaTantangan();break;
    case 'mulaiTantangan':{const c=UI.chal;tutup();const topik=c.ti===31?null:topikLevel(c.level)[c.ti];mulai('kuis',topik?topik.id:null,{seed:c.seed,level:c.level,chal:{skor:c.skor}});break}
    case 'klas':UI.klas=d.k;klasemen();break;
    case 'profil':sheetProfil();break;
    case 'pakaiProfil':data.cur=d.id;save();tutup();bukaTab(UI.tab||'belajar');break;
    case 'formTambah':sheet(formProfil('➕ Tambah anggota',null,'tambah'));break;
    case 'ubahProfil':sheet(formProfil('✏️ Ubah profil',P(),'ubah'));break;
    case 'pilihAv':UI.av=d.a;el.parentElement.querySelectorAll('.avb').forEach(b=>b.classList.toggle('on',b===el));break;
    case 'pilihLv':UI.lv=+d.l;el.parentElement.querySelectorAll('.lt').forEach(b=>b.classList.toggle('on',b===el));break;
    case 'simpanProfil':simpanProfil(d.mode);break;
    case 'lapLevel':UI.lap=+d.l;saya();break;
    case 'hapusCatatan':if(confirm(`Hapus semua catatan, XP, dan lencana ${P().name}?`)){const p=P();Object.assign(p,{xp:0,stats:{},days:{},streak:0,best:0,last:'',badges:[]});save();saya()}break;
    case 'hapusProfil':if(data.profiles.length>1&&confirm(`Hapus pemain ${P().name} beserta semua catatannya?`)){data.profiles=data.profiles.filter(x=>x.id!==data.cur);data.cur=data.profiles[0].id;save();bukaTab('belajar')}break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='kode')terimaTantangan();
  if(S&&S.mode==='kuis'&&S.items[S.i]&&S.items[S.i].isian&&!S.dijawab&&!e.target.closest('input,textarea')){if(/^[0-9]$/.test(e.key))tekan(e.key);else if(e.key===',')tekan(',');else if(e.key==='-')tekan('−');else if(e.key==='Backspace')tekan('⌫');else if(e.key==='Enter')periksa()}});
const app=document.getElementById('app');
home();

</script>
